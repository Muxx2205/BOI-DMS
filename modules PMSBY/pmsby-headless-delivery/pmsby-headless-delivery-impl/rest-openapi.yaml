info:
    description: "PmsbyHeadlessDelivery REST API"
    license:
        name: "Apache 2.0"
        url: "http://www.apache.org/licenses/LICENSE-2.0.html"
    title: "PmsbyHeadlessDelivery"
    version: v1.0
openapi: 3.0.1
paths:
  /request-pmsby:
    get:
      operationId: getRequestPmsbys
      tags:
        - Pmsby
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: filter
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
        - name: sort
          in: query
          required: false
          schema:
            type: string
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BOIHeadlessResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/BOIHeadlessResponse"


  /request-pmsby/{id}:
    get:
      operationId: getRequestPmsby
      tags:
        - Pmsby
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BOIHeadlessResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/BOIHeadlessResponse"


  /add-pmsby/saveAsDraft:
    post:
      operationId: addPmsbyAsDraft
      tags:
        - Pmsby
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BOIHeadlessResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/BOIHeadlessResponse"
                
  /add-pmsby/saveAsExport:
    post:
      operationId: addPmsbyAsExport
      tags:
        - Pmsby
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BOIHeadlessResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/BOIHeadlessResponse"
components:
  schemas:
    BOIHeadlessResponse:
      type: object
      properties:
        responseId:
          type: integer
        responseStatus:
          type: string
 