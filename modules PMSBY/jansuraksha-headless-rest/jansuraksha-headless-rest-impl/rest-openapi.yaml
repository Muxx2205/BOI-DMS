info:
    description: "JanSuraksha Headless REST API for Consent Document Management"
    license:
        name: "Apache 2.0"
        url: "http://www.apache.org/licenses/LICENSE-2.0.html"
    title: "JanSurakshaHeadlessDelivery"
    version: v1.0
openapi: 3.0.1
paths:
  # ==================== API 1: Upload Consent Document ====================
  /jansuraksha/consent/upload:
    post:
      operationId: uploadConsentDocument
      tags:
        - JanSuraksha
      summary: "Upload consent document with metadata using Base64 encoding"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JanSurakshaUploadRequest"
          application/xml:
            schema:
              $ref: "#/components/schemas/JanSurakshaUploadRequest"
      responses:
        200:
          description: "Success"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JanSurakshaUploadResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/JanSurakshaUploadResponse"
        400:
          description: "Bad Request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        500:
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ==================== API 2: Get All Records ====================
  /jansuraksha/consent/records:
    get:
      operationId: getJanSurakshaRecords
      tags:
        - JanSuraksha
      summary: "Get all consent records with branch hierarchy filtering"
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: accountNumber
          in: query
          required: false
          schema:
            type: string
        - name: branchCode
          in: query
          required: false
          schema:
            type: string
        - name: customerName
          in: query
          required: false
          schema:
            type: string
        - name: typeOfInsurance
          in: query
          required: false
          schema:
            type: string
        - name: urn
          in: query
          required: false
          schema:
            type: string
        - name: year
          in: query
          required: false
          schema:
            type: string
        - name: documentFileName
          in: query
          required: false
          schema:
            type: string
        - name: documentFileType
          in: query
          required: false
          schema:
            type: string
        - name: fromDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        200:
          description: "Success"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JanSurakshaResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/JanSurakshaResponse"

  # ==================== API 3: Get Single Record ====================
  /jansuraksha/consent/record/{id}:
    get:
      operationId: getJanSurakshaRecord
      tags:
        - JanSuraksha
      summary: "Get single consent record by ID"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: "Success"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JanSurakshaResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/JanSurakshaResponse"

components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          enum: [FAILED]
        message:
          type: string

    JanSurakshaResponse:
      type: object
      properties:
        responseId:
          type: integer
        responseStatus:
          type: string

    JanSurakshaUploadResponse:
      type: object
      properties:
        status:
          type: string
          enum: [SUCCESS, FAILED]
        documentReferenceNo:
          type: string
        entryId:
          type: integer
          format: int64
        message:
          type: string

    JanSurakshaUploadRequest:
      type: object
      required:
        - document
        - documentFileName
        - documentFileType
        - metadata
      properties:
        document:
          type: string
          description: "Base64 encoded document content"
        documentFileName:
          type: string
          description: "Original filename with extension"
        documentFileType:
          type: string
          enum: [pdf, jpg, png]
        metadata:
          $ref: "#/components/schemas/JanSurakshaMetadata"

    JanSurakshaMetadata:
      type: object
      required:
        - accountNumber
        - branchCode
        - customerName
        - typeOfInsurance
      properties:
        accountNumber:
          type: string
          description: "Bank account number"
        branch:
          type: string
          description: "Branch name"
        branchCode:
          type: string
          pattern: "^[0-9]{4}$"
          description: "4-digit branch code"
        customerId:
          type: string
          description: "Bank's internal customer ID"
        customerName:
          type: string
          description: "Full name of customer"
        nBGCode:
          type: string
          description: "NBG Code"
        solId:
          type: string
          description: "SOL ID"
        typeOfInsurance:
          type: string
          enum: [PMJJBY, PMSBY]
          description: "Type of insurance scheme"
        transDate:
          type: string
          format: date
          description: "Transaction date (YYYY-MM-DD)"
        urn:
          type: string
          description: "JanSuraksha URN"
        year:
          type: string
          description: "Policy year (e.g., 2026-27)"
        zone:
          type: string
          description: "Zone name"