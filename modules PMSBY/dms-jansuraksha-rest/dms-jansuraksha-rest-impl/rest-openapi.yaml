info:
    description: "JanSuraksha Consent REST API for PMJJBY/PMSBY Document Management"
    license:
        name: "Apache 2.0"
        url: "http://www.apache.org/licenses/LICENSE-2.0.html"
    title: "JanSurakshaConsentDelivery"
    version: v1.0
openapi: 3.0.1
paths:
  /jan-suraksha/consent/upload:
    post:
      operationId: uploadConsentDocument
      tags:
        - JanSuraksha
      summary: "Upload consent document with metadata using Base64 encoding"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Base64ConsentUploadRequest"
          application/xml:
            schema:
              $ref: "#/components/schemas/Base64ConsentUploadRequest"
      responses:
        200:
          description: "Success"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentUploadResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/ConsentUploadResponse"

  /jan-suraksha/consent/records:
    get:
      operationId: getConsentRecords
      tags:
        - JanSuraksha
      summary: "Get consent records with branch hierarchy filtering"
      parameters:
        - name: branchCode
          in: query
          required: false
          schema:
            type: string
        - name: insuranceType
          in: query
          required: false
          schema:
            type: string
        - name: policyYear
          in: query
          required: false
          schema:
            type: string
        - name: mobileNumber
          in: query
          required: false
          schema:
            type: string
        - name: bankAccountNo
          in: query
          required: false
          schema:
            type: string
        - name: urn
          in: query
          required: false
          schema:
            type: string
        - name: fromDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        200:
          description: "Success"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BOIHeadlessResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/BOIHeadlessResponse"

  /jan-suraksha/consent/record/{id}:
    get:
      operationId: getConsentRecord
      tags:
        - JanSuraksha
      summary: "Get single consent record by ID"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: "Success"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BOIHeadlessResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/BOIHeadlessResponse"

components:
  schemas:
    BOIHeadlessResponse:
      type: object
      properties:
        responseId:
          type: integer
        responseStatus:
          type: string

    ConsentUploadResponse:
      type: object
      properties:
        status:
          type: string
          enum: [Success, Failed]
        documentReferenceNo:
          type: string
        entryId:
          type: integer
          format: int64
        message:
          type: string

    Base64ConsentUploadRequest:
      type: object
      required:
        - document
        - documentFileName
        - documentFileType
        - metadata
      properties:
        document:
          type: string
        documentFileName:
          type: string
        documentFileType:
          type: string
          enum: [pdf, jpg, png]
        metadata:
          $ref: "#/components/schemas/ConsentMetadata"

    ConsentMetadata:
      type: object
      required:
        - accountHolderName
        - mobileNumber
        - bankAccountNo
        - ifscCode
        - insuranceType
        - policyYear
        - policyIssuanceStatus
        - transactionDate
        - documentPushDateTime
        - documentSentStatus
        - branchName
      properties:
        accountHolderName:
          type: string
        fatherHusbandName:
          type: string
        address:
          type: string
        city:
          type: string
        district:
          type: string
        state:
          type: string
        pinCode:
          type: string
        mobileNumber:
          type: string
          pattern: "^[0-9]{10}$"
        bankAccountNo:
          type: string
        ifscCode:
          type: string
        customerId:
          type: string
        occupation:
          type: string
        kycDocumentName:
          type: string
        kycIdNumber:
          type: string
        panNumber:
          type: string
        aadhaarNumber:
          type: string
        dateOfBirth:
          type: string
          format: date
        emailId:
          type: string
          format: email
        nomineeName:
          type: string
        nomineeAddress:
          type: string
        nomineeDob:
          type: string
          format: date
        nomineeRelation:
          type: string
        guardianName:
          type: string
        guardianAddress:
          type: string
        guardianRelation:
          type: string
        guardianMobile:
          type: string
          pattern: "^[0-9]{10}$"
        guardianEmail:
          type: string
          format: email
        urn:
          type: string
        insuranceType:
          type: string
          enum: [PMJJBY, PMSBY]
        policyYear:
          type: string
        policyIssuanceStatus:
          type: string
          enum: [success, failed]
        transactionDate:
          type: string
          format: date-time
        documentPushDateTime:
          type: string
          format: date-time
        documentReferenceNo:
          type: string
        documentSentStatus:
          type: string
          enum: [success, failed]
        branchName:
          type: string
          pattern: "^[A-Za-z0-9]+-[A-Za-z0-9\\s]+$"
        branchCode:
          type: string