info:
    description: "CustomerAccountHeadlessDelivery REST API"
    license:
        name: "Apache 2.0"
        url: "http://www.apache.org/licenses/LICENSE-2.0.html"
    title: "CustomerAccountHeadlessDelivery"
    version: v1.0
openapi: 3.0.1
paths:
  /request-account-opening:
    get:
      operationId: getRequestAccountOpenings
      tags:
        - RequestAccountOpening
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: filter
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
        - name: sort
          in: query
          required: false
          schema:
            type: string
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestAccountOpeningResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/RequestAccountOpeningResponse"

  /request-account-opening/{id}:
    get:
      operationId: getRequestAccountOpening
      tags:
        - RequestAccountOpening
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestAccountOpeningResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/RequestAccountOpeningResponse"

  /add-account-opening/saveAsDraft:
    post:
      operationId: addRequestAccountOpeningAsDraft
      tags:
        - RequestAccountOpening
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestAccountOpeningResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/RequestAccountOpeningResponse"
                
  /add-account-opening/saveAsExport:
    post:
      operationId: addRequestAccountOpeningAsExport
      tags:
        - RequestAccountOpening
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestAccountOpeningResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/RequestAccountOpeningResponse"
  /request-meta-data:
    get:
      operationId: getRequestMetaData
      tags:
        - Metadata
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestAccountOpeningResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/RequestAccountOpeningResponse"
  /get-token:
    get:
      operationId: getToken
      tags:
        - CustomToken
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestAccountOpeningResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/RequestAccountOpeningResponse"
components:
  schemas:
    RequestAccountOpeningResponse:
      type: object
      properties:
        responseId:
          type: integer
        responseStatus:
          type: string