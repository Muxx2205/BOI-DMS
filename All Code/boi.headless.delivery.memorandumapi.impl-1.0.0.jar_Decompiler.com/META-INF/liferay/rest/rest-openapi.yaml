openapi: 3.0.1

info:
  title: "BoiHeadlessDeliveryMemorandumapi"
  description: "BoiHeadlessDeliveryMemorandumapi REST API"
  version: "v1.0"
  license:
    name: "Apache 2.0"
    url: "http://www.apache.org/licenses/LICENSE-2.0.html"

paths:

  /request-memo-list:
    get:
      operationId: getMemoList
      tags:
        - Memorandum
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: filter
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
        - name: sort
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BOIHeadlessResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/BOIHeadlessResponse"


  /request-memo/{id}:
    get:
      operationId: getMemo
      tags:
        - Memorandum
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BOIHeadlessResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/BOIHeadlessResponse"


  /workflow-memo:
    post:
      operationId: approveOrRejectMemo
      tags:
        - Memorandum
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Memo file to export

      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BOIHeadlessResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/BOIHeadlessResponse"


