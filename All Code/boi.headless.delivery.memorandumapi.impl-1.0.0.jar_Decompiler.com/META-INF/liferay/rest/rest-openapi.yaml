      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
          application/xml:
            schema:
              type: array
              items:
                type: object

      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BOIHeadlessResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/BOIHeadlessResponse"
 
