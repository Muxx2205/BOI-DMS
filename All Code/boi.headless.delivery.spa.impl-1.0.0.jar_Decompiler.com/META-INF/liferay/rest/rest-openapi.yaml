  /files/{fileEntryId}:
    get:
      summary: Download File by ID
      description: Returns the binary content of a file
      operationId: downloadFile
      tags:
        - FileDownload
      parameters:
        - name: fileEntryId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: FileEntryId of the file in Liferay
      responses:
        '200':
          description: Binary file stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: File not found
        '500':
          description: Server error                                                                 
                                                  
