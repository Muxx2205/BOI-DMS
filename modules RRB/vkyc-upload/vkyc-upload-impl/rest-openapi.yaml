info:
    description: "VKYC Upload REST API"
    license:
        name: "Apache 2.0"
        url: "http://www.apache.org/licenses/LICENSE-2.0.html"
    title: "VkycUpload"
    version: v1.0
openapi: 3.0.1
paths:

  # ==================== 2. CREATE FOLDER ====================
  /vkyc/folder/create:
    post:
      operationId: createFolder
      tags: [Vkyc]
      summary: "Create a folder under the parent folder index"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                folderName:
                  type: string
                parentFolderIndex:
                  type: string
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BOIHeadlessResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/BOIHeadlessResponse"

  # ==================== 3. SEARCH FOLDERS ====================
  /vkyc/folder/search:
    get:
      operationId: searchFolders
      tags: [Vkyc]
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: filter
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
        - name: sort
          in: query
          required: false
          schema:
            type: string
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BOIHeadlessResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/BOIHeadlessResponse"

  # ==================== 4. UPLOAD DOCUMENT ====================
  /vkyc/document/upload:
    post:
      operationId: uploadDocument
      tags: [Vkyc]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                folderIndex:
                  type: string
                vkycDocument:
                  type: string
                  format: binary
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BOIHeadlessResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/BOIHeadlessResponse"

  # ==================== 5. SEARCH DOCUMENTS ====================
  /vkyc/document/search:
    get:
      operationId: searchDocuments
      tags: [Vkyc]
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: filter
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
        - name: sort
          in: query
          required: false
          schema:
            type: string
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BOIHeadlessResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/BOIHeadlessResponse"

  # ==================== 6. DOWNLOAD DOCUMENT ====================
  /vkyc/document/download/{fileEntryId}:
    get:
      operationId: downloadDocument
      tags: [Vkyc]
      parameters:
        - name: fileEntryId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        200:
          description: Binary stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

components:
  schemas:
    BOIHeadlessResponse:
      type: object
      properties:
        responseId:
          type: integer
        responseStatus:
          type: string
        values:
          type: object
          additionalProperties: true